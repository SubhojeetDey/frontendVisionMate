{% extends 'main/base.html' %}

{% block title %}Guardian Login{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-4xl font-extrabold text-vm-navy">
                Guardian Login
            </h2>
            <p class="mt-2 text-center text-lg text-gray-600">
                Monitor your loved one's journey
            </p>
        </div>

        <!-- Error Message Display -->
        {% if messages %}
        <div class="bg-red-100 border border-vm-red text-vm-red px-4 py-3 rounded-lg relative" role="alert">
            <strong class="font-bold">Login Failed:</strong>
            <ul class="mt-1 list-disc list-inside">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form class="mt-8 space-y-6" action="{% url 'main:guardian_login' %}" method="POST">
            
            <!-- CSRF Token (Security) -->
            {% csrf_token %}

            <input type="hidden" name="remember" value="true">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="guardian-user-id" class="sr-only">Guardian User ID</label>
                    <input id="guardian-user-id" name="guardian_user_id" type="text" autocomplete="username" required 
                           class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-vm-green focus:border-vm-green focus:z-10 sm:text-lg" 
                           placeholder="Guardian User ID">
                </div>
                <div>
                    <label for="guardian-password" class="sr-only">Password</label>
                    <input id="guardian-password" name="password" type="password" autocomplete="current-password" required 
                           class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-vm-green focus:border-vm-green focus:z-10 sm:text-lg" 
                           placeholder="Password">
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-lg font-medium rounded-md text-white bg-vm-green hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-vm-green shadow-md transition-colors duration-300">
                    Login as Guardian
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
