<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Login - VisionMate</title>
    <!-- We are loading Tailwind CSS from the same CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Optional: Custom theme configuration for Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Matching the theme from the home page
                        'vm-navy': '#192a56', 
                        'vm-orange': '#f39c12',
                        'vm-orange-dark': '#e67e22',
                        'vm-bg': '#f4f7f6', 
                    }
                }
            }
        }
    </script>
    <!-- Using Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6; /* Applying our light gray background */
        }
    </style>
</head>
<body class="bg-vm-bg text-gray-900">

    <!-- 
      This is our main container. 
      'flex', 'flex-col', 'min-h-screen' makes it a full-height column.
    -->
    <div class="flex flex-col min-h-screen">

        <!-- Navigation Bar -->
        <nav class="bg-white shadow-sm w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <!-- Logo / Brand Name -->
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-2xl font-bold text-vm-navy">VisionMate</span>
                    </div>
                    
                    <!-- Back Button -->
                    <div class="flex items-center">
                        <!-- This links back to the 'home' page -->
                        <a href="{% url 'home' %}" 
                           class="text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">
                           Back
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <!-- 'flex-grow flex items-center justify-center' will center the login form vertically and horizontally -->
        <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
            
            <div class="max-w-md w-full space-y-8">
                <!-- Login Card -->
                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <div class="p-8 sm:p-10">
                        <div class="text-center">
                            <h2 class="text-3xl font-bold text-vm-navy">
                                Guardian Login
                            </h2>
                            <p class="mt-2 text-gray-600">
                                Monitor and track your loved ones safely
                            </p>
                        </div>

                        <!-- Login Form -->
                        <!-- 
                          This form points to the 'guardian_login' URL.
                          Just like the driver form, it will just refresh for now.
                        -->
                        <form class="mt-8 space-y-6" action="{% url 'guardian_login' %}" method="POST">
                            {% csrf_token %}
                            <div class="rounded-md shadow-sm -space-y-px">
                                <!-- Guardian User ID -->
                                <div>
                                    <label for="guardian-user-id" class="block text-sm font-medium text-gray-700 mb-1">Guardian User ID</label>
                                    <input id="guardian-user-id" name="guardian_user_id" type="text" required
                                           class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm"
                                           placeholder="Enter your user ID">
                                </div>
                                
                                <!-- Password -->
                                <div class="pt-4">
                                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input id="password" name="password" type="password" required
                                           class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm"
                                           placeholder="Enter your password">
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div>
                                <!-- This button is green to match the home page card -->
                                <button type="submit"
                                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                                    Login as Guardian
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-vm-bg border-t border-gray-200">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-center text-gray-500">
                &copy; 2025 VisionMate. All rights reserved.
            </div>
        </footer>

    </div>

</body>
</html>
